on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        description: If true, pushes image to container registry

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The checks image, tagged <version> and latest
          - target: runtime
            suffix: ""
          # The same with Playwright and Chromium for the UI checks, tagged
          # <version>-browser and latest-browser
          - target: browser
            suffix: -browser

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need this to get version number from last tag
          fetch-depth: 0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Docker Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and export to Docker local cache
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          target: ${{ matrix.target }}
          # Need load and tags so we can test it below
          load: true
          tags: tag_for_testing

      - name: Test cli works in cached runtime image
        run: docker run --rm tag_for_testing --version

      - name: Test Chromium starts in cached browser image
        if: matrix.target == 'browser'
        run: >
          docker run --rm --entrypoint python tag_for_testing -c
          "from playwright.sync_api import sync_playwright as p;
          b = p().start().chromium.launch(); print('chromium', b.version)"

      - name: Create tags for publishing image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # A release tag (0.2.0) also moves latest (latest-browser); a
          # pre-release tag (0.2.0-beta.1, any tag with a '-') moves neither
          flavor: |
            latest=${{ !contains(github.ref_name, '-') }}
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=ref,event=tag

      - name: Push cached image to container registry
        if: inputs.publish && github.ref_type == 'tag'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        # This does not build the image again, it will find the image in the
        # Docker cache and publish it
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
